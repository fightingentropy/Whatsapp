# Shared CLI: gem install native-packages --version 0.5.1
---
schema: 1
tool:
  version: 0.5.1
  nfpm: 2.47.0
nfpm:
  name: zapfast
  maintainer: Carmine Paolino <carmine@paolino.me>
  homepage: https://zapfast.rocks
  description: Fast native WhatsApp client
  license: MIT
  provides: [fastsapp]
  conflicts: [fastsapp]
  replaces: [fastsapp]
  contents:
  - src: "@PAYLOAD@/zapfast-v@VERSION@-@TARGET@/zapfast"
    dst: "/usr/bin/zapfast"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/zapfast-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/zapfast/LICENSE"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zapfast-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/zapfast/README.md"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zapfast-v@VERSION@-@TARGET@/packaging/applications/zapfast.desktop"
    dst: "/usr/share/applications/zapfast.desktop"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zapfast-v@VERSION@-@TARGET@/packaging/icons/zapfast.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/zapfast.svg"
    file_info:
      mode: 420
  overrides:
    deb:
      depends:
      - libc6 (>= 2.39)
      - libgl1
      - libxkbcommon0
      - libwayland-client0
      - libx11-6
      - libasound2
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - glibc >= 2.39
      - libglvnd-glx
      - libxkbcommon
      - wayland-libs
      - libX11
      - alsa-lib
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/zapfast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: zapfast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/zapfast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: zapfast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: crmne/zapfast
  checksums: checksums.txt
assets:
  AMD64:
    file: zapfast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/zapfast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: zapfast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/zapfast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  SOURCE:
    file: zapfast-@VERSION@.tar.gz
    url: https://github.com/crmne/zapfast/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/zapfast-@VERSION@.tar.gz
templates:
  arch/zapfast/PKGBUILD: packaging/arch/zapfast/PKGBUILD.in
  arch/zapfast/zapfast.install: packaging/arch/zapfast.install
  arch/zapfast-bin/PKGBUILD: packaging/arch/zapfast-bin/PKGBUILD.in
  arch/zapfast-bin/zapfast-bin.install: packaging/arch/zapfast.install
  arch/zapfast-git/PKGBUILD: packaging/arch/zapfast-git/PKGBUILD.in
  arch/zapfast-git/zapfast-git.install: packaging/arch/zapfast.install
repositories:
  aur-source:
    group: aur
    url: https://aur.archlinux.org/zapfast.git
    push_url: ssh://aur@aur.archlinux.org/zapfast.git
    branch: master
    package_path: "."
    files:
      arch/zapfast: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-bin:
    group: aur
    url: https://aur.archlinux.org/zapfast-bin.git
    push_url: ssh://aur@aur.archlinux.org/zapfast-bin.git
    branch: master
    package_path: "."
    files:
      arch/zapfast-bin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-git:
    group: aur
    url: https://aur.archlinux.org/zapfast-git.git
    push_url: ssh://aur@aur.archlinux.org/zapfast-git.git
    branch: master
    package_path: "."
    files:
      arch/zapfast-git: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
version_file: Cargo.toml
