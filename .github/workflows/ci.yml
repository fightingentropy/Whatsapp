name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Apple Silicon checks
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check native runner
        run: test "$(uname -m)" = arm64
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests (default features)
        run: cargo test --locked --all-targets
      - name: Tests (all features)
        run: cargo test --locked --all-targets --all-features
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps
      - name: macOS window smoke test
        timeout-minutes: 3
        run: |
          cargo build --locked --features demo
          binary=target/aarch64-apple-darwin/debug/zapfast
          test "$(lipo -archs "$binary")" = arm64
          "$binary" --demo --demo-shot "$RUNNER_TEMP/zapfast-content.png"
          test -s "$RUNNER_TEMP/zapfast-content.png"
          "$binary" --demo --demo-page video --demo-shot "$RUNNER_TEMP/zapfast-video.png"
          test -s "$RUNNER_TEMP/zapfast-video.png"
          "$binary" --demo --demo-page long --demo-shot "$RUNNER_TEMP/zapfast-long-history.png"
          test -s "$RUNNER_TEMP/zapfast-long-history.png"
          "$binary" --demo --demo-page many-chats --demo-shot "$RUNNER_TEMP/zapfast-many-chats.png"
          test -s "$RUNNER_TEMP/zapfast-many-chats.png"
      - name: Main-thread background wake test
        run: cargo run --locked --example background_probe
      - name: macOS preview
        uses: actions/upload-artifact@v7
        with:
          name: macos-preview
          path: ${{ runner.temp }}/zapfast-*.png
