name: Packaging validation

on:
  push:
    branches: [main]
    paths: [native-packages.yaml, native-packages.macos.yaml, packaging/macos/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  pull_request:
    paths: [native-packages.yaml, native-packages.macos.yaml, packaging/macos/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Validate Mac recipes
        run: |
          bash -n packaging/macos/build-local.sh packaging/macos/bundle.sh packaging/macos/verify.sh
          ruby -c packaging/macos/dmg.rb
          plutil -lint packaging/macos/Info.plist packaging/macos/entitlements.plist
