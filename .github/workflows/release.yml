name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Baked into the binary by settings.rs; releases built without the
  # secret simply ship keyless and the picker asks for one.
  WHATSAPP_GIPHY_KEY: ${{ secrets.WHATSAPP_GIPHY_KEY }}

jobs:
  macos:
    name: Apple Silicon app
    runs-on: macos-15
    env:
      # Complete Apple credentials enable native-packages signing/notarization.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin
      - run: rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Build Apple Silicon
        run: cargo build --locked --release --target aarch64-apple-darwin

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install native packaging
        run: gem install native-packages --version 0.5.1 --no-document

      - name: App bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/macos-input
          bash packaging/macos/bundle.sh target/aarch64-apple-darwin/release/whatsapp "dist/macos-input/Whatsapp.app" "$version"
          cp README.md LICENSE dist/macos-input/

      - name: Package, sign and notarize macOS app
        run: |
          native-packages --config native-packages.macos.yaml build \
            --version "${GITHUB_REF_NAME#v}" --target macos-arm64 \
            --output "$RUNNER_TEMP/macos-packages"
          cp "$RUNNER_TEMP/macos-packages/packages/macos-arm64/dmg/"*.dmg dist/

      - name: Verify the notarized release app
        run: bash packaging/macos/verify.sh "dist/whatsapp-${GITHUB_REF_NAME}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
