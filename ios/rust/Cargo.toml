[package]
name = "whatsapp-ios-core"
version = "0.13.1"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
demo = []

[dependencies]
anyhow = "1"
sha2 = "0.11"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
hkdf = "0.13"
hmac = "0.13"
zip = { version = "5", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f7468ae2920a2b0aedbd0848cf121de56a07f93c", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
jiff = "0.2"
mime_guess2 = "2"
opus = "0.4"
ogg = "0.9"
webp-animation = "0.10"
resvg = { version = "0.45", default-features = false }

# Host-side archive/worker tests exercise the exact same sources as the Mac app.
# None of these desktop libraries is linked into the iOS target.
[target.'cfg(target_os = "macos")'.dependencies]
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "links", "persistence"] }
rfd = { version = "0.17", default-features = false }
objc2 = "0.6"
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3"
png = "0.18"
