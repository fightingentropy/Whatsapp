# Build the complete app input in the native macOS release job first.
schema: 1
tool:
  version: 0.5.1
  nfpm: 2.47.0
nfpm:
  name: whatsapp
  maintainer: Erlin Hoxha
  description: Whatsapp for Apple Silicon Macs
  license: MIT
release:
  repository: fightingentropy/Whatsapp
  prereleases: true
targets:
  macos-arm64:
    platform: macos
    arch: arm64
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'whatsapp-@TAG@-macos-arm64.dmg'
